name: Python Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check whitespace and indentation
        working-directory: Python
        run: |
          pip install ruff
          ruff check . --select E101,W191,W291,W293

      - name: Run tests
        working-directory: Python
        run: python -m pytest